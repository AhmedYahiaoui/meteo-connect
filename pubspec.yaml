name: meteo_connect
description: A cross-platform weather application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.0
  lottie: ^2.7.0
  provider: ^6.1.1
  http: ^1.1.0
  connectivity_plus: ^5.0.2
  intl: ^0.20.1
  geocoding: ^3.0.0
  custom_refresh_indicator: ^4.0.1
  sugar: ^3.1.0
  collection: ^1.18.0
  timezone: ^0.8.0
  rive: ^0.13.20
  rive_common: ^0.4.15
  dropdown_search: ^6.0.2
  flutter_local_notifications: ^8.2.0
  permission_handler: ^11.3.1
  flutter_dotenv: ^5.2.1
  
  # fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  fonts:
    - family: Montserrat
      fonts:
        - asset: fonts/Montserrat-light.ttf
        - asset: fonts/Montserrat-Medium.ttf
        - asset: fonts/Montserrat-Regular.ttf
        - asset: fonts/Montserrat-SemiBold.ttf
        - asset: fonts/Montserrat-Bold.ttf
        
  assets:
    - assets/animations/
    - assets/animations/rive/
    - assets/images/
    - assets/actions/

